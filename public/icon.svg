<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF542B"/>
      <stop offset="100%" stop-color="#F0441D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="#393939" stroke-width="4"/>
  <!-- Dumbbell Icon / Logo Monogram -->
  <g transform="translate(256, 256) scale(1.1) translate(-256, -256)">
    <!-- Dumbbell Bar -->
    <rect x="156" y="240" width="200" height="32" rx="16" fill="#FFFFFF"/>
    <!-- Left Weight Plates -->
    <rect x="120" y="196" width="36" height="120" rx="12" fill="url(#brandGrad)"/>
    <rect x="88" y="216" width="24" height="80" rx="8" fill="#F0441D"/>
    <!-- Right Weight Plates -->
    <rect x="356" y="196" width="36" height="120" rx="12" fill="url(#brandGrad)"/>
    <rect x="400" y="216" width="24" height="80" rx="8" fill="#F0441D"/>
    <!-- Center Brand Text -->
    <text x="256" y="380" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="76" text-anchor="middle" fill="#FFFFFF" letter-spacing="4">
      FIT<tspan fill="#F0441D">HUB</tspan>
    </text>
  </g>
</svg>
